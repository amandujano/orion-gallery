spring.application.name=orions-gallery

# Server
server.port=8080

# Serve Angular's index.html for unknown paths (SpaController handles this,
# but this disables Spring's whitelabel error page as a fallback)
spring.web.resources.add-mappings=true
server.error.whitelabel.enabled=false

# Both images and gallery metadata are stored in Vercel Blob.
# Get this token from:
#   Vercel Dashboard your project  Storage Blob  .env.local tab
#   It starts with "vercel_blob_rw_..."
vercel.blob.token=${BLOB_READ_WRITE_TOKEN}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
